{% extends 'club/base.html' %}

{% block title %}Logged out — Eschen Chess Club{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="container">
        <div class="auth-card text-center">
            <span class="auth-king">&#9812;</span>
            <h2 class="auth-title mt-2">You have been logged out</h2>
            <p class="auth-sub">Thank you for visiting. See you over the board next time.</p>

            <div class="d-grid gap-2 mt-4">
                <a href="{% url 'login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Log in again
                </a>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-house"></i> Back to home
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
